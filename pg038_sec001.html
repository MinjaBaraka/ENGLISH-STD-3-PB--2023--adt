  <style>
    body {
      background: #fff;
    }

    .classroom-song-page {
      position: relative;
      box-sizing: border-box;
      width: min(1174px, calc(100vw - 14px));
      max-width: none !important;
      min-height: 1050px;
      margin: 4px auto;
      padding: 150px 152px 112px;
      overflow: hidden;
      background: #fff;
    }

    .classroom-song-page::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0 auto 0 44px;
      width: 112px;
      opacity: .7;
      background: radial-gradient(ellipse at 100% 8%, #f7dde2 0 18%, transparent 19%), radial-gradient(ellipse at 0 28%, #fbe5e7 0 20%, transparent 21%), linear-gradient(90deg, #f9d7df, #fcebf0 58%, transparent);
    }

    .classroom-song-page::after {
      content: "";
      position: absolute;
      z-index: 5;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(#555, #555) 18px 44px/34px 1px no-repeat, linear-gradient(#555, #555) 44px 18px/1px 34px no-repeat, linear-gradient(#555, #555) calc(100% - 52px) 44px/34px 1px no-repeat, linear-gradient(#555, #555) calc(100% - 45px) 18px/1px 34px no-repeat;
    }

    .classroom-song-page>* {
      position: relative;
      z-index: 1;
    }

    .classroom-song-page img {
      display: block;
      width: min(820px, 100%);
      margin: 0 auto;
    }

    @media (max-width:800px) {
      .classroom-song-page {
        width: 100%;
        min-height: 100vh;
        padding: 72px 36px 90px 76px;
      }

      .classroom-song-page::before {
        inset: 0 auto 0 14px;
        width: 58px;
      }
    }
  </style>
</head>
