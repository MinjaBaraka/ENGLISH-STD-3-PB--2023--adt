                (function () {

                        window.fetch = async function (input, init) {
                                const url = typeof input === 'string' ? input : input && input.url;
                                if (!url || !url.split('?')[0].endsWith('/content/i18n/en-GB/audios.json')) return preloadFetch(input, init);
                                const response = await preloadFetch(input, init);
                                const audios = await response.clone().json();
                                audios.pg011_n0031 = 'pg011_n0031.mp3';
                                return new Response(JSON.stringify(audios), { status: response.status, headers: { 'Content-Type': 'application/json' } });
                        };
                })();
        </script>
